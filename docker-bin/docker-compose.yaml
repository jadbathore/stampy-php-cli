services:
  stampy:
    container_name: stampy
    build:
      context: .
      dockerfile: ./dockerfile
      platforms:
        - linux/arm64
      args:
        ENTRY: ${ENTRY} 
    command: ["sh", "-c", "composer dump-autoload && tail -f /dev/null"]
    volumes:
      - ${PROJECT_ROOT:-.}/${ENTRY}:/${ENTRY}
      - ${PROJECT_ROOT:-.}/.env:/.env
      - ${PROJECT_ROOT:-.}/composer.stampy.json:/composer.json
      - ${PROJECT_ROOT:-.}:/tmp
